{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h4>Edit Hotel: {{ hotel.name }}</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label>Hotel Name</label>
                    <input type="text" name="name" class="form-control" value="{{ hotel.name }}" required>
                </div>
                <div class="mb-3">
                    <label>Price per Night</label>
                    <input type="number" name="price" class="form-control" value="{{ hotel.price }}" required>
                </div>
                <div class="mb-3">
                    <label>Description</label>
                    <textarea name="description" class="form-control" required>{{ hotel.description }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                <a href="/dashboard" class="btn btn-secondary w-100 mt-2">Back to Dashboard</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
