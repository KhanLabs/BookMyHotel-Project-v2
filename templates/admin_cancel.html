{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card border-danger shadow">
        <div class="card-header bg-danger text-white">
            <h4>Cancel Reservation #{{ res.id }}</h4>
        </div>
        <div class="card-body">
            <p><strong>Guest:</strong> {{ res.guest_name }}</p>
            <p><strong>Hotel:</strong> {{ res.hotel_name }}</p>
            <form method="POST">
                <div class="mb-3">
                    <label>Cancellation Reason (Required for Audit)</label>
                    <textarea name="reason" class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-danger w-100">Confirm Cancellation</button>
                <a href="/dashboard" class="btn btn-secondary w-100 mt-2">Back</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
